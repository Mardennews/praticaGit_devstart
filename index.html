<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Minha Página Incrível</title>

    <style>
        /* Define estilos gerais para a página */
        body {
            font-family: Arial, sans-serif; /* Fonte padrão */
            line-height: 1.6;               /* Espaçamento entre linhas */
            background-color: #f4f4f4;      /* Cor de fundo da página */
            color: #333;                   /* Cor do texto */
            margin: 0;
            padding: 0;
        }

        /* Um "container" para centralizar seu conteúdo */
        main {
            max-width: 800px;  /* Largura máxima do conteúdo */
            margin: 20px auto; /* Centraliza na página (20px em cima/baixo, auto nas laterais) */
            padding: 20px;     /* Espaçamento interno */
            background-color: #ffffff; /* Fundo branco para o conteúdo */
            border-radius: 8px;      /* Cantos arredondados */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); /* Sombra leve */
        }

        /* Estilo para o título principal */
        h1 {
            color: #0056b3; /* Cor do título (um azul) */
        }

        /* Estilo para imagens */
        img {
            max-width: 100%; /* Faz a imagem nunca ultrapassar o container */
            height: auto;
            border-radius: 4px; /* Cantos arredondados na imagem */
        }

        /* Estilo para links */
        a {
            color: #007bff; /* Cor do link */
            text-decoration: none; /* Remove o sublinhado */
        }
        a:hover {
            text-decoration: underline; /* Adiciona sublinhado ao passar o mouse */
        }
    </style>
</head>
<body>

    <main>

        <h1>Olá, Mundo!</h1>

        <p>Este é o meu novo site. Estou aprendendo HTML e posso modificar qualquer parte deste arquivo. É muito fácil!</p>
        
        <hr> <h2>O que eu posso fazer:</h2>
        <ul>
            <li>Modificar este texto.</li>
            <li>Adicionar mais parágrafos (usando a tag `<p>`).</li>
            <li>Mudar as cores no CSS (na área `<style>` lá em cima).</li>
        </ul>

        <h2>Exemplo de Imagem:</h2>
        <p>Mude o atributo `src` abaixo para o link de uma imagem da web ou o caminho de uma imagem local.</p>
        <img src="https://via.placeholder.com/600x200" alt="Descrição da imagem (importante!)">
        
        <h2>Exemplo de Link:</h2>
        <p>Este link leva para o Google. Mude o `href` para qualquer site que você quiser.</p>
        <p>
            <a href="https://www.google.com" target="_blank">Clique aqui para ir ao Google</a>
            </p>

    </main>

    <script>
        // Seu código JavaScript vai aqui.
        // Por enquanto, ele só envia uma mensagem para o console do navegador.
        // (Pressione F12 no navegador para ver o console)
        
        console.log("Minha página HTML foi carregada!");

        // Você pode adicionar interatividade aqui, como:
        // document.querySelector('h1').addEventListener('click', function() {
        //     alert('Você clicou no título!');
        // });

    </script>

</body>
</html>
